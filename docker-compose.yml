services:
  tolqc-db:
    image: postgres:14
    environment:
      - TZ=Europe/London
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    ports:
      - 5435:5432
    healthcheck:
      test: ["CMD", "pg_isready", "--port=5432"]
      interval: 1s
      retries: 10

  tolqc-api:
    build:
      context: tolqc-api
      dockerfile: Dockerfile.dev
    image: tolqc-api
    environment:
      - DB_URI
      - TOLQC_URL
      - API_PATH
      - API_TOKEN
      - ELIXIR_CLIENT_ID
      - ELIXIR_CLIENT_SECRET
      - ELIXIR_REDIRECT_URI
      - ELIXIR_JWK
      - MAIL_SENDER
      - MAIL_SENDER_NAME
      - MAIL_USERNAME_SMTP
      - MAIL_PASSWORD_SMTP
      - MAIL_HOST
      - MAIL_PORT
      - ENVIRONMENT
      - FLASK_ENV
    ports:
      - 8082:80
    depends_on:
      tolqc-db:
        condition: service_healthy

  tolqc-ui:
    build:
      context: ./tolqc-ui
      dockerfile: Dockerfile.dev
    image: tolqc-ui
    # force amd64 on M1 MacOS
    platform: linux/amd64
    stdin_open: true
    environment:
      - NODE_ENV=development
      - REACT_APP_API_PATH=${API_PATH}
      - REACT_APP_MATOMO_SITE_ID=${MATOMO_SITE_ID}
    ports:
      - 3004:3000
    volumes:
      - './tolqc-ui/app:/usr/src/app'
      - '/usr/src/app/node_modules'

  tolqc-ui-test:
    image: tolqc-ui
    command: yarn test
    stdin_open: true
    environment:
      - NODE_ENV=development
    volumes:
      - './tolqc-ui/app:/usr/src/app'
      - '/usr/src/app/node_modules'

  tolqc-dbutils:
    image: gitlab-registry.internal.sanger.ac.uk/tol/tol-core/dbutils:1.0.3
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - POSTGRES_HOST
      - POSTGRES_PORT
      - BACKUP_S3_ACCESS_KEY
      - BACKUP_S3_SECRET_KEY
      - BACKUP_S3_URI
      - BACKUP_S3_BUCKET
      - BACKUP_S3_SECURE
      - RESTORE_FILE_PREFIX
      - FLASK_ENV
      - BACKUP_SCHEDULE

  tolqc-alembic:
    image: tolqc-api
    container_name: tolqc-alembic
    restart: always
    environment:
      - DB_URI
    working_dir: /migrations
    volumes:
      - ./tolqc-api/migrations/alembic/versions:/migrations/alembic/versions

  tolqc-python-db:
    image: postgres:14
    environment:
      - TZ=Europe/London
      - POSTGRES_USER=test-user
      - POSTGRES_PASSWORD=test-password
      - POSTGRES_DB=test-db
    healthcheck:
      test: ["CMD", "pg_isready", "--port=5432"]
      interval: 1s
      retries: 10

  tolqc-python-unit-test:
    build:
      context: ./tolqc-api
      dockerfile: Dockerfile.test
    command: pytest -vv unit

  tolqc-python-system-test:
    build:
      context: ./tolqc-api
      dockerfile: Dockerfile.test
    command: pytest -vv system
    environment:
      - DB_URI=postgresql://test-user:test-password@tolqc-python-db:5432/test-db
    depends_on:
      tolqc-python-db:
        condition: service_healthy
